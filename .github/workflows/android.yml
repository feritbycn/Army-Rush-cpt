name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 requires JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm test
      - run: npm run build

      # android/ is not committed; generate it fresh on every run
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/ArmyRush-debug.apk
          ls -lh apk

      - uses: actions/upload-artifact@v4
        with:
          name: army-rush-debug-apk
          path: apk/ArmyRush-debug.apk

      # Publish as a GitHub Release asset (stable download link)
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest apk/ArmyRush-debug.apk \
            --title "Army Rush - latest APK" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Install on Android (allow installs from unknown sources)." \
            --target "$GITHUB_SHA"

      # Also keep the APK inside the repo (apk/ folder)
      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/ArmyRush-debug.apk
          git diff --cached --quiet || git commit -m "chore: update APK [skip ci]"
          git push
